<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务器状态面板</title>
<style>
:root{
  --bg:#0f1216; --card:#171c22; --card2:#1d242b; --line:#242c35;
  --fg:#e6edf3; --dim:#8b98a5; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --idle:#6e7681;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
.meta{color:var(--dim);font-size:12px;margin-left:auto;display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
main{padding:12px 14px 40px;max-width:1180px;margin:0 auto}
section{margin-bottom:18px}
h2{font-size:12px;color:var(--dim);font-weight:600;margin:0 0 8px;text-transform:uppercase;letter-spacing:.8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card.down{border-color:#5c2b28;background:#1e1a1a}
.card.warn{border-color:#5a4a1f}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.name{font-weight:600;font-size:13px}
.tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.st{margin-left:auto;font-size:11px;color:var(--dim)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.m{font-size:12px;color:var(--dim)}
.m b{color:var(--fg);font-weight:600}
.bar{height:4px;background:#0b0e12;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.detail{margin-top:8px;font-size:11px;color:var(--dim);word-break:break-all}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11.5px}
.pill .ms{color:var(--dim);font-size:10.5px}
footer{color:var(--idle);font-size:11px;text-align:center;padding:10px}
.warnrow{background:#241f16;border:1px solid #5a4a1f;color:#e3b341;border-radius:6px;
  padding:8px 10px;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<header>
  <h1>服务器状态面板</h1>
  <span class="tag" id="region">cloady · usw1</span>
  <div class="meta">
    <span id="age">—</span>
    <span class="dot" id="live" style="background:var(--idle)"></span>
  </div>
</header>
<main>
  <div class="warnrow" id="warnrow"></div>
  <section>
    <h2>主机</h2>
    <div class="grid" id="hosts"></div>
  </section>
  <section>
    <h2>站点与服务</h2>
    <div class="pills" id="services"></div>
  </section>
  <section>
    <h2>面板自身</h2>
    <div class="grid" id="box"></div>
  </section>
</main>
<footer>每 60 秒自动刷新 · 采集端每 5 分钟推送</footer>
<script>
const REFRESH = 60;
const COLOR = {ok:'var(--ok)', warn:'var(--warn)', down:'var(--bad)', unknown:'var(--idle)'};
const LABEL = {ok:'正常', warn:'注意', down:'离线', unknown:'未知'};

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function pct(v){return (v==null||isNaN(v))?'—':v.toFixed(0)+'%';}
function barCls(v){return v>=90?'bad':v>=75?'warn':'';}
function ago(ts){
  if(!ts) return '—';
  const s = Math.max(0, Date.now()/1000 - ts);
  if(s<90) return Math.round(s)+' 秒前';
  if(s<5400) return Math.round(s/60)+' 分钟前';
  if(s<172800) return (s/3600).toFixed(1)+' 小时前';
  return Math.round(s/86400)+' 天前';
}

function hostCard(h){
  const st = h.status || 'unknown';
  const c = el('div','card '+(st==='down'?'down':st==='warn'?'warn':''));
  const top = el('div','top');
  top.appendChild(el('span','dot')); top.firstChild.style.background = COLOR[st];
  top.appendChild(el('span','name', h.name||h.id));
  if(h.kind) top.appendChild(el('span','tag', h.kind));
  top.appendChild(el('span','st', LABEL[st]||st));
  c.appendChild(top);

  if(h.kind === 'lan' || h.kind === 'sandbox' || h.kind === 'vultr'){
    c.appendChild(el('div','metrics m', h.detail || '连通'));
    return c;
  }

  const m = el('div','metrics');
  const load = el('div','m','负载 <b>'+(h.load==null?'—':h.load)+'</b>'); m.appendChild(load);
  const up = el('div','m','运行 <b>'+(h.uptime||'—')+'</b>'); m.appendChild(up);
  for(const [label,val] of [['内存',h.mem_pct],['磁盘',h.disk_pct]]){
    const d = el('div','m', label+' <b>'+pct(val)+'</b>');
    const b = el('div','bar'); const i = el('i'); i.className = barCls(val==null?0:val);
    i.style.width = (val==null?0:Math.min(100,val))+'%'; b.appendChild(i); d.appendChild(b);
    m.appendChild(d);
  }
  c.appendChild(m);
  if(h.detail) c.appendChild(el('div','detail', h.detail));
  return c;
}

function render(data){
  const hosts = document.getElementById('hosts'); hosts.innerHTML='';
  (data.hosts||[]).forEach(h => hosts.appendChild(hostCard(h)));

  const svc = document.getElementById('services'); svc.innerHTML='';
  (data.services||[]).forEach(s=>{
    const st = s.status || 'unknown';
    const p = el('div','pill');
    const d = el('span','dot'); d.style.background = COLOR[st];
    p.appendChild(d); p.appendChild(el('span',null,s.name));
    if(s.ms!=null) p.appendChild(el('span','ms', s.ms+'ms'));
    if(s.code) p.appendChild(el('span','ms', 'HTTP '+s.code));
    p.title = (s.url||'') + (s.detail?(' — '+s.detail):'');
    svc.appendChild(p);
  });

  const boxBox = document.getElementById('box'); boxBox.innerHTML='';
  const b = data.box || {};
  const c = el('div','card');
  const top = el('div','top');
  top.appendChild(el('span','dot')); top.firstChild.style.background='var(--ok)';
  top.appendChild(el('span','name','cloady box'));
  top.appendChild(el('span','tag','usw1 · 0.5C/1G'));
  top.appendChild(el('span','st','在线'));
  c.appendChild(top);
  const m = el('div','metrics');
  m.appendChild(el('div','m','累计 CPU <b>'+(b.cpu_seconds!=null?b.cpu_seconds+' 秒':'—')+'</b>'));
  m.appendChild(el('div','m','当前内存 <b>'+(b.mem_mib!=null?b.mem_mib+' MiB':'—')+'</b>'));
  c.appendChild(m);
  c.appendChild(el('div','detail','数据推送：'+ago(data.received||Date.parse(data.updated)/1000)));
  boxBox.appendChild(c);

  const bad = (data.hosts||[]).filter(h=>h.status==='down').map(h=>h.name||h.id);
  const warn = (data.hosts||[]).filter(h=>h.status==='warn').map(h=>h.name||h.id);
  const wr = document.getElementById('warnrow');
  if(bad.length||warn.length){
    wr.style.display='block';
    wr.textContent = (bad.length?('离线：'+bad.join('、')+'　'):'') + (warn.length?('注意：'+warn.join('、')):'');
  } else wr.style.display='none';

  document.getElementById('age').textContent='更新于 '+ago(data.received||Date.parse(data.updated)/1000);
}

let timer=null, left=REFRESH;
async function tick(){
  try{
    const r = await fetch('/api/status',{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    render(await r.json());
    document.getElementById('live').style.background='var(--ok)';
  }catch(e){
    document.getElementById('live').style.background='var(--bad)';
    document.getElementById('age').textContent='拉取失败（'+e.message+'），5 秒后重试';
    setTimeout(tick, 5000);
    return;
  }
  left = REFRESH;
}
setInterval(()=>{left--; if(left<=0) tick();},1000);
tick();
</script>
</body>
</html>
